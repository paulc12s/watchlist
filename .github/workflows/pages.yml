# Tests, stamps the commit hash into the app, and publishes to GitHub Pages.
# The stamp lets installed copies (e.g. iOS home-screen apps) notice a new
# deploy and reload; see js/version-check.js.
#
# Actions are pinned to commit SHAs (tag in the comment); Dependabot
# (.github/dependabot.yml) opens a PR when a new version is out.
#
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Stamp version
        run: |
          VERSION="${GITHUB_SHA::7}"
          sed -i "s/__APP_VERSION__/$VERSION/g" app.html batch-upload.html js/config.js version.json
          if grep -rl "__APP_VERSION__" --include='*.html' --include='*.js' --include='*.json' . | grep -v '^./tests/'; then
            echo "Unstamped files remain" && exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
