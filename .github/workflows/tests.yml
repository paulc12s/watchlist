# Runs the tests on every pull request (including Dependabot's), so a broken
# change shows up before it's merged. Deploys still run the tests again in
# pages.yml.
name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: node --test tests/watchlist.test.js tests/ratings.test.js
